<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #f7f9fb;
      }
      iframe {
        display: block;
        border: 0;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <script>
      const q = new URLSearchParams(location.search);
      const f = document.createElement("iframe");
      f.width = q.get("w") || "375";
      f.height = q.get("h") || "900";
      f.src = q.get("path") || "/";
      f.setAttribute("scrolling", "no");
      document.body.appendChild(f);
    </script>
  </body>
</html>
